apiVersion: 1

policies:
  - orgId: 1
    receiver: ayphr-alerts
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: ayphr-alerts
        matchers:
          - severity = critical
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 1h
        continue: false

      - receiver: ayphr-alerts
        matchers:
          - severity = info
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h
        continue: false
