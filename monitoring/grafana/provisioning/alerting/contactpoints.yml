apiVersion: 1

contactPoints:
  - orgId: 1
    name: ayphr-alerts
    receivers:
      - uid: ayphr_alerts_webhook
        type: slack
        disableResolveMessage: false
        settings:
          url: $ALERT_WEBHOOK_URL
          title: |
            {{ template "slack.default.title" . }}
          text: |
            {{ template "slack.default.text" . }}
